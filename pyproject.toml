[project]
name = "itg-llm"
version = "0.1.0"
description = "LLM pipeline for text processing: summary, key points and a helpful response"
readme = "README.md"
authors = [
    { name = "imiderji", email = "skishou.developer@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.36.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
itg-llm = "itg_llm.main:main"
itg-llm-compare = "itg_llm.compare:main"
itg-llm-check-replies = "itg_llm.check_replies:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["itg_llm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
